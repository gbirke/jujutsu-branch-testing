<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Mara Finch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>Contact Mara Finch</h1>
    <p>Need a courier for the unusual? Want to collaborate on an occult mapping project?  
    Drop a message below — I’ll find you before dawn does.</p>

    <form>
      <label for="name">Name</label>
      <input id="name" type="text" name="name" placeholder="Your name">

      <label for="email">Email</label>
      <input id="email" type="email" name="email" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="What’s on your mind?"></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p class="footer"><a href="index.html">← Back to profile</a></p>
  </div>
</body>
</html>
